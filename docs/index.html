<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
  <a class="brand" href="#/"><span class="brand-mark">🏰</span><span class="brand-text">Sky <em>Castle</em></span></a>

    <h2>Your progress</h2>

      <button type="button" class="btn" id="exportBtn">Export progress</button>

      <button type="button" class="btn danger" id="resetBtn">Reset all</button>
    </div>
    <div id="acct"></div>
    <h3>Editor</h3>
    <label class="check"><input type="checkbox" id="optVim"> Vim key bindings</label>
    <label class="check"><input type="checkbox" id="optWrap"> Wrap long lines</label>
    <div class="dlg-row end"><button class="btn primary">Close</button></div>
  </form>
</dialog>
